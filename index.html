<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de pedidos · Tienda de ropa</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--fg:#1d2430;--muted:#5d6675;--card:#fff;--bd:#d3d8df;--acc:#2e86c1;--accfg:#fff;--c0:#fdecea;--c1:#fff6e0;--c2:#e8f6ec;--c3:#e6f0fa;--alta:#c0392b;--media:#a96a00;--baja:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181f;--fg:#e8ebf0;--muted:#a0a8b5;--card:#1e242e;--bd:#38404d;--acc:#5aa9dd;--accfg:#0b1118;--c0:#3a2523;--c1:#3a3220;--c2:#1f3427;--c3:#1f2e3f;--alta:#ff7b6b;--media:#f0b254;--baja:#5fd08a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181f;--fg:#e8ebf0;--muted:#a0a8b5;--card:#1e242e;--bd:#38404d;--acc:#5aa9dd;--accfg:#0b1118;--c0:#3a2523;--c1:#3a3220;--c2:#1f3427;--c3:#1f2e3f;--alta:#ff7b6b;--media:#f0b254;--baja:#5fd08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;text-align:center;margin:4px 0 14px;letter-spacing:.03em}
#conexion{font-size:.7em;color:var(--muted);margin-right:8px;vertical-align:middle;cursor:default}
#conexion.ok{color:var(--baja)}#conexion.mal{color:var(--alta)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,input,select{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search input{max-width:320px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.col{border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:240px}
.col h2{font-size:.95rem;text-align:center;margin:2px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.col small{color:var(--muted);font-weight:400}
.col:nth-child(1){background:var(--c0)}.col:nth-child(2){background:var(--c1)}.col:nth-child(3){background:var(--c2)}
.card{display:block;width:100%;text-align:left;margin-bottom:6px;border-left:5px solid var(--muted)}
.card.sel{outline:2px solid var(--acc)}
.card.Alta{border-left-color:var(--alta)}.card.Media{border-left-color:var(--media)}.card.Baja{border-left-color:var(--baja)}
.card b{display:block}.card span{color:var(--muted);font-size:.9rem}
.vacio{color:var(--muted);text-align:center;font-size:.9rem;padding:14px 0}
#detalle{margin-top:12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;line-height:1.6}
#detalle .tag{font-weight:600}
#detalle a{color:var(--acc);margin-right:14px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:18px;width:min(440px,92vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px}
label{display:block;margin:8px 0 3px;font-size:.9rem;color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{color:var(--alta);margin:8px 0 0;min-height:1.2em;font-size:.9rem}
.tabs{display:none}
@media (max-width:760px){
  main{padding:12px 12px 96px}
  h1{font-size:1.1rem}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:8px 2px;font-size:.75rem;min-height:44px;line-height:1.2}
  .tabs button.act{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;flex-wrap:nowrap;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .bar button{flex:1;min-height:46px;font-size:1.15rem;padding:6px}
  .bar .t{display:none}
  .search label{width:100%}
  .search input{max-width:none;flex:1;min-width:0}
  input,select{font-size:16px;min-height:44px}
  .col{display:none;min-height:140px}
  .col.act{display:block}
  .col h2{display:none}
  .card{padding:12px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .acts button{flex:1;min-height:44px}
}
#impresion{display:none}
@media print{
  :root{color-scheme:light;padding:0}
  body{background:#fff}
  body::before,main,dialog{display:none!important}
  #impresion{display:block;color:#000;background:#fff;font:14px/1.5 Arial,sans-serif}
  #impresion h2{margin:0 0 4px;font-size:22px}
  #impresion table{width:100%;border-collapse:collapse;margin-top:12px}
  #impresion th,#impresion td{border:1px solid #000;padding:6px 8px;text-align:left;vertical-align:top}
  #impresion th{width:32%;background:#eee}
}
</style>
</head>
<body>
<main>
  <h1><span id="conexion" role="status" title="Conectando con Firebase…" aria-label="Conectando con Firebase…">●</span>SISTEMA DE PEDIDOS Y ENVÍOS DE ROPA</h1>

  <div class="bar">
    <button class="pri" id="bNuevo" aria-label="Nuevo pedido">➕<span class="t"> Nuevo</span></button>
    <button id="bAtras" aria-label="Mover a la columna anterior">◀<span class="t"> Mover</span></button>
    <button id="bAdelante" aria-label="Mover a la columna siguiente"><span class="t">Mover </span>▶</button>
    <button id="bEditar" aria-label="Editar pedido">✏️<span class="t"> Editar</span></button>
    <button id="bImprimir" aria-label="Imprimir pedido">🖨️<span class="t"> Imprimir</span></button>
    <button id="bElim" aria-label="Eliminar pedido">🗑<span class="t"> Eliminar</span></button>
    <button id="bStats" aria-label="Estadísticas">📊<span class="t"> Estadísticas</span></button>
  </div>

  <div class="search">
    <label for="q" style="margin:0">Buscar pedido, cliente, teléfono o producto:</label>
    <input id="q" type="search" autocomplete="off">
    <button id="bLimpiar">Limpiar</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <div id="detalle"></div>
</main>

<div id="impresion"></div>

<dialog id="dNuevo">
  <form id="fForm" method="dialog" novalidate>
    <h3 id="fTitulo">Registrar nuevo pedido</h3>
    <label for="fCliente">Nombre del cliente</label><input id="fCliente" autocomplete="off">
    <label for="fTel">Teléfono con código de país (opcional)</label><input id="fTel" type="tel" inputmode="tel">
    <label for="fProducto">Producto de ropa</label><input id="fProducto" autocomplete="off">
    <label for="fTalla">Talla</label>
    <select id="fTalla"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>XXL</option><option>Única</option></select>
    <label for="fCantidad">Cantidad</label><input id="fCantidad" type="number" min="1" step="1" inputmode="numeric">
    <label for="fPrecio">Precio unitario (opcional)</label><input id="fPrecio" type="number" min="0" step="0.01" inputmode="decimal">
    <label for="fDir">Dirección de entrega</label><input id="fDir" autocomplete="off">
    <label for="fDesc">Descripción (opcional)</label><input id="fDesc" autocomplete="off">
    <label for="fPrio">Prioridad</label>
    <select id="fPrio"><option>Alta</option><option selected>Media</option><option>Baja</option></select>
    <p class="err" id="fErr"></p>
    <div class="acts"><button type="button" id="fCancel">Cancelar</button><button type="submit" class="pri" id="fOk">Guardar pedido</button></div>
  </form>
</dialog>

<dialog id="dMsg">
  <h3 id="mTitulo"></h3>
  <div id="mTexto" style="white-space:pre-line"></div>
  <div class="acts"><button id="mCancel">Cancelar</button><button class="pri" id="mOk">Aceptar</button></div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo9w8szraqqOAYH0ZL0MVDNPFA3E4YBrs",
  authDomain: "proyecto-5ef22.firebaseapp.com",
  databaseURL: "https://proyecto-5ef22-default-rtdb.firebaseio.com",
  projectId: "proyecto-5ef22",
  storageBucket: "proyecto-5ef22.firebasestorage.app",
  messagingSenderId: "378158267050",
  appId: "1:378158267050:web:51d2cc18ab03be34356ed3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const refPedidos = ref(db, "pedidos");

const COLUMNAS = ["Pedido recibido", "Preparando", "Enviado"];
const ETIQ = ["Recibidos", "Preparando", "Enviados"];
const RANGO = { Alta: 0, Media: 1, Baja: 2 };
let pedidos = [], sel = null, tab = 0, editId = null;

const $ = id => document.getElementById(id);
const obtener = id => pedidos.find(p => p.id === id) || null;
const refPedido = id => ref(db, "pedidos/p" + id);
const vis = x => (x === undefined || x === null || x === "") ? "—" : String(x);
const fecha = p => p.creado
  ? new Date(p.creado).toLocaleString("es", { dateStyle: "short", timeStyle: "short" })
  : vis(p.fecha);

function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}

/* ---------- Sincronización en tiempo real ---------- */
onValue(refPedidos, snap => {
  pedidos = Object.values(snap.val() || {}).filter(Boolean).sort((a, b) => a.id - b.id);
  render();
}, err => {
  const c = $("conexion");
  c.title = c.ariaLabel = "Error al leer datos: " + err.message;
  c.className = "mal";
});

onValue(ref(db, ".info/connected"), snap => {
  const ok = snap.val() === true;
  const c = $("conexion");
  c.title = c.ariaLabel = ok ? "Conectado a Firebase" : "Sin conexión con Firebase";
  c.className = ok ? "ok" : "mal";
});

/* ---------- Interfaz ---------- */
function render() {
  const q = $("q").value.trim().toLowerCase();
  const board = $("board");
  board.textContent = "";
  const tabs = $("tabs");
  tabs.textContent = "";
  const visibles = new Set();

  COLUMNAS.forEach((col, idx) => {
    const c = el("section", "col" + (idx === tab ? " act" : ""));
    // Orden: prioridad Alta primero y, dentro de cada prioridad, los más antiguos
    const lista = pedidos.filter(p => p.estado === col && (!q ||
      (p.id + " " + p.cliente + " " + p.telefono + " " + p.producto).toLowerCase().includes(q)))
      .sort((a, b) => (RANGO[a.prioridad] ?? 1) - (RANGO[b.prioridad] ?? 1) || a.id - b.id);
    const h = el("h2", "", col + " ");
    h.appendChild(el("small", "", "(" + lista.length + ")"));
    const tb = el("button", idx === tab ? "act" : "", ETIQ[idx] + " (" + lista.length + ")");
    tb.onclick = () => { tab = idx; render(); };
    tabs.appendChild(tb);
    c.appendChild(h);
    if (!lista.length) c.appendChild(el("div", "vacio", "No hay pedidos."));
    lista.forEach(p => {
      visibles.add(p.id);
      const b = el("button", "card " + p.prioridad + (p.id === sel ? " sel" : ""));
      b.setAttribute("aria-pressed", p.id === sel);
      b.appendChild(el("b", "", "#" + p.id + "  " + p.cliente));
      b.appendChild(el("span", "", p.producto + (p.talla ? " (" + p.talla + ")" : "") + " ×" + p.cantidad));
      b.onclick = () => {
        sel = p.id; render();
        if (matchMedia("(max-width:760px)").matches)
          $("detalle").scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
      c.appendChild(b);
    });
    board.appendChild(c);
  });

  if (sel !== null && !visibles.has(sel)) sel = null;
  detalle(obtener(sel));
}

function detalle(p) {
  const d = $("detalle");
  d.textContent = "";
  if (!p) { d.textContent = "Selecciona un pedido para ver los detalles."; return; }
  const precio = Number(p.precio) > 0 ? Number(p.precio) : null;
  const filas = [
    [["PEDIDO N.º", p.id], ["Estado", p.estado]],
    [["Cliente", p.cliente], ["Teléfono", p.telefono]],
    [["Producto", p.producto], ["Talla", p.talla], ["Cantidad", p.cantidad]],
    [["Precio unitario", precio && precio.toFixed(2)], ["Total", precio && (precio * p.cantidad).toFixed(2)]],
    [["Dirección de entrega", p.direccion]],
    [["Prioridad", p.prioridad], ["Fecha", fecha(p)]],
    [["Descripción", p.descripcion || "(sin descripción)"]]
  ];
  filas.forEach(f => {
    const row = el("div");
    f.forEach((par, i) => {
      if (i) row.appendChild(document.createTextNode("  |  "));
      row.appendChild(el("span", "tag", par[0] + ": "));
      row.appendChild(document.createTextNode(vis(par[1])));
    });
    d.appendChild(row);
  });

  const enlaces = el("div");
  const tel = String(p.telefono || "").replace(/\D/g, "");
  const enlace = (txt, url) => {
    const a = el("a", "", txt);
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    enlaces.appendChild(a);
  };
  if (tel) enlace("💬 Avisar por WhatsApp", "https://wa.me/" + tel + "?text=" +
    encodeURIComponent("Hola " + p.cliente + ", tu pedido #" + p.id + " está en estado: " + p.estado + "."));
  if (p.direccion) enlace("📍 Ver en el mapa",
    "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.direccion));
  d.appendChild(enlaces);
}

function mensaje(titulo, texto, onOk) {
  $("mTitulo").textContent = titulo;
  $("mTexto").textContent = texto;
  $("mCancel").style.display = onOk ? "" : "none";
  $("mOk").textContent = onOk ? "Sí" : "Aceptar";
  $("mOk").onclick = () => { $("dMsg").close(); if (onOk) onOk(); };
  $("mCancel").onclick = () => $("dMsg").close();
  $("dMsg").showModal();
}

const falloFirebase = e => mensaje("Error de Firebase",
  "No se pudo completar la operación.\n" + (e && e.message ? e.message : e));

/* ---------- Acciones ---------- */
async function mover(dir) {
  const p = obtener(sel);
  if (!p) return mensaje("Mover pedido", "Primero selecciona un pedido.");
  const n = COLUMNAS.indexOf(p.estado) + dir;
  if (n < 0 || n >= COLUMNAS.length) return mensaje("Mover pedido", "El pedido ya está en el primer o último estado.");
  tab = n;
  try { await update(refPedido(p.id), { estado: COLUMNAS[n] }); } catch (e) { falloFirebase(e); }
}

function eliminar() {
  const p = obtener(sel);
  if (!p) return mensaje("Eliminar pedido", "Primero selecciona un pedido.");
  mensaje("Eliminar pedido", "¿Eliminar el pedido de " + p.cliente + "?", async () => {
    try { await remove(refPedido(p.id)); sel = null; } catch (e) { falloFirebase(e); }
  });
}

function estadisticas() {
  const n = e => pedidos.filter(p => p.estado === e).length;
  const total = pedidos.length, env = n("Enviado");
  const importe = pedidos.reduce((s, p) => s + (Number(p.precio) > 0 ? p.precio * p.cantidad : 0), 0);
  mensaje("Estadísticas de pedidos",
    "Total de pedidos: " + total +
    "\nRecibidos: " + n("Pedido recibido") +
    "\nPreparando: " + n("Preparando") +
    "\nEnviados: " + env +
    "\nPrioridad alta: " + pedidos.filter(p => p.prioridad === "Alta").length +
    "\nPorcentaje enviado: " + (total ? env / total * 100 : 0).toFixed(1) + "%" +
    "\nImporte total de pedidos: " + importe.toFixed(2));
}

function imprimir() {
  const p = obtener(sel);
  if (!p) return mensaje("Imprimir pedido", "Primero selecciona un pedido.");
  const precio = Number(p.precio) > 0 ? Number(p.precio) : null;
  const filas = [
    ["Estado", p.estado], ["Fecha", fecha(p)], ["Cliente", p.cliente], ["Teléfono", p.telefono],
    ["Producto", p.producto], ["Talla", p.talla], ["Cantidad", p.cantidad],
    ["Precio unitario", precio && precio.toFixed(2)], ["Total", precio && (precio * p.cantidad).toFixed(2)],
    ["Dirección de entrega", p.direccion], ["Prioridad", p.prioridad],
    ["Descripción", p.descripcion || "(sin descripción)"]
  ];
  const hoja = $("impresion");
  hoja.textContent = "";
  hoja.appendChild(el("h2", "", "Pedido N.º " + p.id));
  hoja.appendChild(el("div", "", "Tienda de ropa · Hoja de pedido y envío"));
  const t = el("table");
  filas.forEach(([k, v]) => {
    const tr = el("tr");
    tr.appendChild(el("th", "", k));
    tr.appendChild(el("td", "", vis(v)));
    t.appendChild(tr);
  });
  hoja.appendChild(t);
  window.print();
}

/* ---------- Formulario (nuevo y editar) ---------- */
function abrirForm(p) {
  editId = p ? p.id : null;
  $("fTitulo").textContent = p ? "Editar pedido #" + p.id : "Registrar nuevo pedido";
  $("fOk").textContent = p ? "Guardar cambios" : "Guardar pedido";
  const sT = $("fTalla");
  [...sT.options].filter(o => o.dataset.x).forEach(o => o.remove());
  if (p && p.talla && ![...sT.options].some(o => o.value === p.talla)) {
    const o = new Option(p.talla, p.talla); o.dataset.x = 1; sT.add(o);
  }
  const val = {
    fCliente: p && p.cliente, fTel: p && p.telefono, fProducto: p && p.producto,
    fTalla: p ? p.talla : "M", fCantidad: p && p.cantidad,
    fPrecio: p && Number(p.precio) > 0 ? p.precio : "", fDir: p && p.direccion,
    fDesc: p && p.descripcion, fPrio: p ? p.prioridad : "Media"
  };
  for (const k in val) $(k).value = val[k] ?? "";
  $("fErr").textContent = "";
  $("dNuevo").showModal(); $("fCliente").focus();
}

function editar() {
  const p = obtener(sel);
  if (!p) return mensaje("Editar pedido", "Primero selecciona un pedido.");
  abrirForm(p);
}

async function guardarPedido() {
  const v = i => $(i).value.trim();
  const fallo = t => { $("fErr").textContent = t; };
  if (!v("fCliente") || !v("fProducto") || !v("fCantidad") || !v("fDir"))
    return fallo("Completa todos los campos obligatorios.");
  const cant = Number(v("fCantidad"));
  if (!Number.isInteger(cant) || cant <= 0) return fallo("La cantidad debe ser un número mayor a cero.");
  const precio = v("fPrecio") === "" ? 0 : Number(v("fPrecio"));
  if (!(precio >= 0)) return fallo("El precio no es válido.");

  const datos = {
    cliente: v("fCliente"), telefono: v("fTel"), producto: v("fProducto"), talla: $("fTalla").value,
    cantidad: cant, precio, direccion: v("fDir"), descripcion: v("fDesc"), prioridad: $("fPrio").value
  };

  $("fOk").disabled = true;
  try {
    if (editId !== null) {
      await update(refPedido(editId), datos);
    } else {
      // Contador compartido: evita IDs repetidos si hay varios usuarios a la vez
      const r = await runTransaction(ref(db, "contador"), c => (c || 0) + 1);
      const id = r.snapshot.val();
      await set(refPedido(id), { ...datos, id, estado: COLUMNAS[0], creado: Date.now() });
      tab = 0;
    }
    $("dNuevo").close();
  } catch (e) {
    fallo("No se pudo guardar: " + (e.message || e));
  } finally {
    $("fOk").disabled = false;
  }
}

$("bNuevo").onclick = () => abrirForm(null);
$("bAtras").onclick = () => mover(-1);
$("bAdelante").onclick = () => mover(1);
$("bEditar").onclick = editar;
$("bImprimir").onclick = imprimir;
$("bElim").onclick = eliminar;
$("bStats").onclick = estadisticas;
$("bLimpiar").onclick = () => { $("q").value = ""; render(); };
$("q").oninput = render;
$("fCancel").onclick = () => $("dNuevo").close();
$("fForm").onsubmit = e => { e.preventDefault(); guardarPedido(); };
render();
</script>
</body>
</html>
